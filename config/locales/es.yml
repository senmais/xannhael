es:
  hero:
    ruby_title_line1: "Crea aplicaciones modernas con "
    ruby_title_accent: "Rails"
    ruby_title_line2: " y Hotwire"
    ruby_description: "Un framework full-stack con todo incluido: interfaz en tiempo real, trabajos en segundo plano y caché listos para usar."
    hotwire_title_line1: "Interfaces que se actualizan al instante con "
    hotwire_title_accent: "Hotwire"
    hotwire_title_line2: ""
    hotwire_description: "Turbo y Stimulus juntos ofrecen interfaces ágiles renderizadas en el servidor, con una fracción del JavaScript."
    kamal_title_line1: "Despliega a producción con un solo comando — "
    kamal_title_accent: "Kamal"
    kamal_title_line2: ""
    kamal_description: "Despliegues sin interrupciones a cualquier servidor, con proxy integrado, TLS y manejo de assets."
    omarchy_title_line1: "Un espacio de trabajo sereno inspirado en "
    omarchy_title_accent: "Omarchy"
    omarchy_title_line2: ""
    omarchy_description: "Un tema cálido y minimalista que combina la estética de las Guías de Rails con la paleta Everforest."
    ruby_docs: "Documentación de Ruby on Rails"
    hotwire_docs: "Documentación de Hotwire"
    kamal_docs: "Documentación de Kamal"
    omarchy_docs: "Documentación de Omarchy"
    ruby_docs_url: "https://rubyonrails.org/"
    hotwire_docs_url: "https://hotwired.dev/"
    kamal_docs_url: "https://kamal-deploy.org/"
    omarchy_docs_url: "https://github.com/sainnhe/everforest"
  home:
    ruby:
      cards:
        c1_title: "Turbo"
        c1_strong: "Interfaz en tiempo real."
        c1_text: "Turbo Streams y Frames actualizan la página en vivo, sin JavaScript a mano."
        c2_title: "Solid Queue"
        c2_strong: "Trabajos en segundo plano."
        c2_text: "El trabajo pesado corre de forma confiable fuera del ciclo de petición, listo para escalar."
        c3_title: "Solid Cache"
        c3_strong: "Velocidad por defecto."
        c3_text: "El caché en base de datos y de assets mantienen las respuestas rápidas desde el inicio."
        c4_title: "Convenciones"
        c4_strong: "Lanza más rápido."
        c4_text: "Convención sobre configuración te lleva de cero a producción en tiempo récord."
    hotwire:
      title: "Tres herramientas, una filosofía"
      intro: "Hotwire sustituye el pesado stack de SPA por HTML renderizado en el servidor que se actualiza en tiempo real."
      benefits:
        b1: "Sin APIs JSON ni estado del lado del cliente que mantener"
        b2: "Funciona con controladores y vistas de Rails normales"
        b3: "Mejora progresivamente con un poco de Stimulus"
      turbo_drive_title: "Turbo Drive"
      turbo_drive_text: "Acelera la navegación intercambiando el cuerpo de la página y preservando el ciclo de vida completo."
      turbo_frames_title: "Turbo Frames"
      turbo_frames_text: "Acota la navegación a partes de la página, así solo se actualiza el frame que cambia."
      turbo_streams_title: "Turbo Streams"
      turbo_streams_text: "Transmite actualizaciones parciales a cada cliente conectado mediante WebSockets."
      toast_title: "Toast nativo"
      toast_text: "Envía un toast desde la web al shell nativo de Android."
    kamal:
      title: "Despliegues que parecen magia"
      intro: "Kamal lleva tu app a cualquier servidor por SSH: provisiona, construye y despliega sin una plataforma."
      step1_title: "Provisiona"
      step1_text: "Kamal instala Docker y configura el proxy y TLS en un servidor nuevo."
      step2_title: "Construye"
      step2_text: "Se genera una imagen de producción con los assets de Rails precompilados y comprimidos."
      step3_title: "Despliega"
      step3_text: "Despliegues progresivos sin interrupciones y con reversiones instantáneas si algo falla."
      terminal_title: "terminal"
    omarchy:
      title: "¿Qué es Omarchy?"
      text1: "Omarchy es un tema sereno y minimalista construido con Rails y Hotwire, con el estilo de las Guías de Ruby on Rails."
      text2: "Su paleta proviene de Everforest, un esquema verdoso diseñado para reducir la fatiga visual y mantener la concentración."
      image_alt: "Vista previa del esquema de colores Everforest"
      palette_title: "Everforest de un vistazo"
