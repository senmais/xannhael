services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    # Load .env from project root (if it exists) into the container.
    # .env contains optional tool credentials and per-project database settings.
    # OpenCode Go/Zen auth is persisted separately.
    env_file:
      - path: ../.env
        required: false

    # Shared PostgreSQL defaults; override in the project .env. The PG* values
    # keep psql aligned with Active Record.
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-55432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      PGHOST: ${DB_HOST:-host.docker.internal}
      PGPORT: ${DB_PORT:-55432}
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}

    # Docker Desktop / WSL2 host gateway for shared PostgreSQL by default.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ..:/workspaces/project:cached
      - bundle:/usr/local/bundle
      - agent-data:/home/vscode/.local/share
      - bundler-download-cache:/home/vscode/.bundle/cache/gems

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

  # ---------------------------------------------------------------------------
  # Optional local services.
  # ---------------------------------------------------------------------------
  # Disabled by default: Rails uses the shared PostgreSQL host above.
  # To opt into an isolated database, set COMPOSE_PROFILES=local-db and
  # DB_HOST=db in the project .env, then rebuild the Dev Container.
  # PostgreSQL 18 stores data under /var/lib/postgresql/18/docker; mount the
  # parent directory so the versioned data path persists in this clone's volume.
  db:
    image: postgres:18.6
    profiles: [local-db]
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 3
  selenium:
    image: selenium/standalone-chromium:4.51.0-20261010
    # Only started on demand (see above); the rails-app reaches it as
    # SELENIUM_HOST=selenium via test/application_system_test_case.rb.
    profiles:
      - selenium

volumes:
  bundle:
  agent-data:
  postgres-data:
  bundler-download-cache:
    external: true
    name: bundler-download-cache
