name: "xannhael"

services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    # Reach the shared postgres-db container running on the host
    extra_hosts:
    - "host.docker.internal:host-gateway"

    volumes:
    - ../../xannhael:/workspaces/xannhael:cached
    # Persistent state + credentials for CLI tools (survive container rebuilds)
    - codex-home:/home/vscode/.codex
    - opencode-config:/home/vscode/.config/opencode
    - opencode-data:/home/vscode/.local/share/opencode

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Uncomment the next line to use a non-root user for all processes.
    # user: vscode

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)
    # Selenium only needed for system tests; start it on demand with:
    #   docker compose -f .devcontainer/compose.yaml up -d selenium
    # depends_on:
    # - selenium

  # selenium:
  #   image: selenium/standalone-chromium
  #   restart: unless-stopped

volumes:
  codex-home:
  opencode-config:
  opencode-data: