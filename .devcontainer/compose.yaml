services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    # Load .env from project root (if it exists) into the container.
    # .env is the single source of truth for tool credentials
    # (OPENAI_API_KEY, GITHUB_TOKEN/GH_TOKEN). OpenCode Go/Zen auth is persisted separately.
    env_file:
      - path: ../.env
        required: false

    # Reach the shared postgres-db container running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ..:/workspaces/project:cached
      - bundle:/usr/local/bundle
      - agent-data:/home/vscode/.local/share

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

  # ---------------------------------------------------------------------------
  # Optional local services. Both are disabled by default.
  # ---------------------------------------------------------------------------
  # To use a project-local database instead of the shared postgres-db:
  #   1. Uncomment the `db` service and the `postgres-data` volume.
  #   2. Set DB_HOST=db in .env and align Rails credentials
  #      (config/database.yml reads host/port/user/password from credentials
  #      when DB_HOST is set; defaults target the shared container).
  #   3. Recreate the container and run `bin/rails db:prepare`.
  #
  # db:
  #   image: postgres:15
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  selenium:
    image: selenium/standalone-chromium
    restart: unless-stopped
    # Only started on demand (see above); the rails-app reaches it as
    # SELENIUM_HOST=selenium via test/application_system_test_case.rb.
    profiles:
      - selenium

volumes:
  bundle:
  agent-data:
